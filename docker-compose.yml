name: nas-music-kit-api

services:
  music-kit-agent:
    image: ghcr.io/yaobin-kid/nas-music-kit-agent-api:latest
    container_name: nas-music-kit-agent
    restart: unless-stopped
    ports:
      - "${AGENT_HOST_PORT:-8080}:8080"
    volumes:
      - ${MUSIC_DIR:-./music}:/music
      - ${LIBRARY_HOST_DIR:-./library}:/library
      - ${CHARTS_HOST_DIR:-./music-charts}:/charts:ro
    environment:
      MUSIC_API_BASE_URL: ${MUSIC_API_BASE_URL:-http://192.168.1.10:8848}
      MUSIC_API_TIMEOUT: ${MUSIC_API_TIMEOUT:-30}
      MUSIC_API_DOWNLOAD_TIMEOUT: ${MUSIC_API_DOWNLOAD_TIMEOUT:-300}
      MUSIC_API_RETRIES: ${MUSIC_API_RETRIES:-2}
      MUSIC_API_RATE_LIMIT: ${MUSIC_API_RATE_LIMIT:-40}
      MUSIC_API_RATE_WINDOW: ${MUSIC_API_RATE_WINDOW:-300}
      MUSIC_API_COOKIE: ${MUSIC_API_COOKIE:-}
      MUSIC_API_BEARER_TOKEN: ${MUSIC_API_BEARER_TOKEN:-}
      LIBRARY_DIR: /library
      DOWNLOAD_DIR: /music
      MATCH_SOURCE: ${MATCH_SOURCE:-netease}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.9}
      PLAYLIST_MATCH_THRESHOLD: ${PLAYLIST_MATCH_THRESHOLD:-0.86}
      IMPORT_PROXY_URL: ${IMPORT_PROXY_URL:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      NAVIDROME_SCAN_WAIT: ${NAVIDROME_SCAN_WAIT:-true}
      CHARTS_DIR: /charts
      CHARTS_CONFIG: /charts/config.json
      CHARTS_REPORTS_DIR: /tmp/charts-reports
      CHARTS_TIMEOUT: ${CHARTS_TIMEOUT:-3600}
      ALLOWED_CIDRS: ${ALLOWED_CIDRS:-}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TZ: ${TZ:-Asia/Shanghai}
