name: nas-music-kit-api

services:
  music-kit-agent:
    image: ghcr.io/yaobin-kid/nas-music-kit-agent-api:latest
    container_name: nas-music-kit-agent
    restart: unless-stopped
    ports:
      - "${AGENT_HOST_PORT:-8080}:8080"
    environment:
      MUSIC_API_BASE_URL: ${MUSIC_API_BASE_URL:-http://192.168.1.10:8848}
      MUSIC_API_TIMEOUT: ${MUSIC_API_TIMEOUT:-30}
      MUSIC_API_RETRIES: ${MUSIC_API_RETRIES:-2}
      MUSIC_API_COOKIE: ${MUSIC_API_COOKIE:-}
      MUSIC_API_BEARER_TOKEN: ${MUSIC_API_BEARER_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
