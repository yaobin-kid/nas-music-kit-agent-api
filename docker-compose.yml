name: nas-music-kit

services:
  api:
    image: ghcr.io/yaobin-kid/nas-music-kit-agent-api:latest
    container_name: nas-music-kit-api
    restart: unless-stopped
    ports:
      - "${MUSIC_KIT_PORT:-8080}:8080"
    environment:
      MUSIC_API_BASE_URL: ${MUSIC_API_BASE_URL:?请在 .env 中配置 MUSIC_API_BASE_URL}
      MUSIC_API_COOKIE: ${MUSIC_API_COOKIE:-}
      MUSIC_API_BEARER_TOKEN: ${MUSIC_API_BEARER_TOKEN:-}
      MUSIC_API_TIMEOUT: ${MUSIC_API_TIMEOUT:-30}
      MUSIC_API_RETRIES: ${MUSIC_API_RETRIES:-2}
      TZ: ${TZ:-Asia/Shanghai}
